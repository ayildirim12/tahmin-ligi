name: Sync Süper Lig data

on:
  schedule:
    # Every 5 minutes, all day — the floor is on how often a NEW run starts,
    # not on how sub-5-minute freshness happens (that comes from the adaptive
    # in-run poll loop in worker/src/sync.ts when a match is live/imminent).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: superlig-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @google-cloud/firestore (a firebase-admin dependency) requires Node >=22 — on
          # Node 20 npm silently skips it as an unmet optional dependency, which surfaces
          # at runtime as "Cannot find module '@google-cloud/firestore'" (found via a real
          # workflow_dispatch run, not caught locally since local Node was already 22+).
          node-version: 22
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Write service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Run sync
        working-directory: worker
        run: npm run sync
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
          SUPERLIG_LEAGUE_ID: ${{ vars.SUPERLIG_LEAGUE_ID }}
          SUPERLIG_SEASON: ${{ vars.SUPERLIG_SEASON }}
